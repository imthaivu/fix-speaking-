<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudinary Upload Test</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 0.95rem;
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    button.secondary:hover:not(:disabled) {
      background: var(--border);
    }

    button.danger {
      background: var(--error);
    }

    .status {
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.4em;
      margin-top: 12px;
    }

    .status.recording { color: var(--error); font-weight: 600; }
    .status.ok { color: var(--success); }
    .status.err { color: var(--error); }

    .progress-wrap {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress-wrap.visible { display: block; }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.15s ease;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <section>
      <div class="row">
        <button type="button" id="btnRecord">Ghi âm</button>
        <button type="button" id="btnStop" class="danger secondary" disabled>Dừng</button>
        <button type="button" id="btnUpload" disabled>Upload</button>
      </div>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="status" id="status">Chưa ghi âm</p>
    </section>
  </div>

  <script>
    const MAX_BYTES = 15 * 1024 * 1024;
    const CLOUD_NAME = "dbinok791";
    const API_KEY = "992647231676819";
    const UPLOAD_PRESET = "test-speaking";

    const btnRecord = document.getElementById("btnRecord");
    const btnStop = document.getElementById("btnStop");
    const btnUpload = document.getElementById("btnUpload");
    const statusEl = document.getElementById("status");
    const progressWrap = document.getElementById("progressWrap");
    const progressBar = document.getElementById("progressBar");

    let selectedFile = null;
    let mediaRecorder = null;
    let mediaStream = null;
    let recordStartedAt = 0;

    function chooseSupportedMimeType() {
      const candidates = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus",
        "audio/ogg",
        "audio/mpeg",
      ];
      for (const type of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) {
          return type;
        }
      }
      return undefined;
    }

    function stopStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }
    }

    async function startRecording() {
      try {
        selectedFile = null;
        btnUpload.disabled = true;
        progressWrap.classList.remove("visible");
        progressBar.style.width = "0%";

        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = chooseSupportedMimeType();
        mediaRecorder = mimeType
          ? new MediaRecorder(mediaStream, { mimeType })
          : new MediaRecorder(mediaStream);

        const chunks = [];
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const finalType =
            mediaRecorder.mimeType || chunks[0]?.type || "audio/webm";
          const blob = new Blob(chunks, { type: finalType });
          let ext = "webm";
          if (finalType.includes("mpeg") || finalType.includes("mp3")) ext = "mp3";
          else if (finalType.includes("ogg")) ext = "ogg";
          else if (finalType.includes("wav")) ext = "wav";

          const file = new File([blob], "recording." + ext, { type: finalType });
          if (file.size > MAX_BYTES) {
            statusEl.textContent = "Bản ghi vượt quá 15MB.";
            statusEl.className = "status err";
            btnUpload.disabled = true;
            stopStream();
            return;
          }

          selectedFile = file;
          const secs = Math.round((Date.now() - recordStartedAt) / 1000);
          statusEl.textContent = "Đã ghi xong (" + secs + "s) — bấm Upload";
          statusEl.className = "status ok";
          btnUpload.disabled = false;
          stopStream();
        };

        recordStartedAt = Date.now();
        mediaRecorder.start();
        btnRecord.disabled = true;
        btnStop.disabled = false;
        statusEl.textContent = "Đang ghi âm...";
        statusEl.className = "status recording";
      } catch (err) {
        statusEl.textContent = "Không truy cập được mic: " + err.message;
        statusEl.className = "status err";
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      btnRecord.disabled = false;
      btnStop.disabled = true;
    }

    function uploadToCloudinary(file, onProgress) {
      return new Promise((resolve, reject) => {
        const url =
          "https://api.cloudinary.com/v1_1/" +
          encodeURIComponent(CLOUD_NAME) +
          "/auto/upload";

        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", UPLOAD_PRESET);
        formData.append("api_key", API_KEY);
        formData.append("folder", "speaking_submissions/test");

        const xhr = new XMLHttpRequest();
        xhr.open("POST", url);

        xhr.upload.addEventListener("progress", (e) => {
          if (e.lengthComputable && onProgress) {
            onProgress(Math.round((e.loaded / e.total) * 100));
          }
        });

        xhr.addEventListener("load", () => {
          let body;
          try {
            body = JSON.parse(xhr.responseText);
          } catch {
            body = { raw: xhr.responseText };
          }
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(body);
          } else {
            reject({ status: xhr.status, body });
          }
        });

        xhr.addEventListener("error", () => {
          reject({ status: 0, body: { error: { message: "Network error / CORS" } } });
        });

        xhr.send(formData);
      });
    }

    btnRecord.addEventListener("click", startRecording);
    btnStop.addEventListener("click", stopRecording);

    btnUpload.addEventListener("click", async () => {
      if (!selectedFile) {
        statusEl.textContent = "Ghi âm trước khi upload.";
        statusEl.className = "status err";
        return;
      }

      btnUpload.disabled = true;
      btnRecord.disabled = true;
      progressWrap.classList.add("visible");
      progressBar.style.width = "0%";
      statusEl.textContent = "Đang upload...";
      statusEl.className = "status";

      const started = performance.now();

      try {
        const result = await uploadToCloudinary(selectedFile, (pct) => {
          progressBar.style.width = pct + "%";
          statusEl.textContent = "Đang upload... " + pct + "%";
        });

        const elapsed = ((performance.now() - started) / 1000).toFixed(2);
        statusEl.textContent = "Upload thành công (" + elapsed + "s)";
        statusEl.className = "status ok";
        selectedFile = null;
      } catch (err) {
        const elapsed = ((performance.now() - started) / 1000).toFixed(2);
        const msg =
          err.body?.error?.message ||
          err.body?.message ||
          "Upload thất bại";
        statusEl.textContent = msg + " (HTTP " + (err.status || "?") + ", " + elapsed + "s)";
        statusEl.className = "status err";
      } finally {
        btnRecord.disabled = false;
        btnUpload.disabled = !selectedFile;
        progressBar.style.width = "100%";
      }
    });
  </script>
</body>
</html>
